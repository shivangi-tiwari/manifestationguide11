name: YouTube Sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  youtube-sync:
    name: Sync YouTube Videos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate workflow secrets
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$SITE_URL" || -z "$CRON_SECRET" ]]; then
            echo "::error::Configure SITE_URL and CRON_SECRET in repository Actions secrets."
            exit 1
          fi
          if [[ "$SITE_URL" != https://* ]]; then
            echo "::error::SITE_URL must use HTTPS."
            exit 1
          fi

      - name: Trigger YouTube sync
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/youtube-sync-response.json"
          SITE_URL="${SITE_URL%/}"
          set +e
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 300 \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/youtube-sync")"
          curl_status=$?
          set -e

          if [[ -f "$response_file" ]]; then
            cat "$response_file"
          fi

          if [[ "$curl_status" -ne 0 || "$http_status" != "200" ]]; then
            echo "::error::YouTube sync request failed (curl $curl_status, HTTP $http_status)."
            exit 1
          fi
